name: Auto Label Issues

# =============================================================================
# Auto Label Issues Workflow
# =============================================================================
# This workflow automatically analyzes GitHub Issues and applies appropriate
# labels based on the issue content (title, body, and existing labels).
#
# Features:
# - Manual trigger via workflow_dispatch
# - Confidence-based classification
# - Multiple label support
# - Idempotent operations (safe to re-run)
# - Pagination support for large repositories
# - Detailed logging for debugging
#
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no labels applied)'
        required: false
        type: boolean
        default: false
      limit:
        description: 'Maximum number of issues to process (0 for all)'
        required: false
        type: number
        default: 50
      since:
        description: 'Only process issues created since this date (YYYY-MM-DD)'
        required: false
        type: string
        default: ''
      remove_triage:
        description: 'Remove "triage" label when other labels are applied'
        required: false
        type: boolean
        default: true
      confidence_threshold:
        description: 'Confidence threshold for label application (0-100)'
        required: false
        type: number
        default: 35

permissions:
  contents: read
  issues: write

jobs:
  auto-label:
    name: Auto Label Issues
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Auto Label Issues
        uses: actions/github-script@v9
        with:
          script: |
            const { loadRules } = require('./.github/scripts/rules.js');
            const { autoLabelIssues } = require('./.github/scripts/auto-label-issues.js');
            
            const config = {
              dryRun: ${{ inputs.dry_run }},
              limit: ${{ inputs.limit }},
              since: '${{ inputs.since }}',
              removeTriage: ${{ inputs.remove_triage }},
              confidenceThreshold: ${{ inputs.confidence_threshold }},
              maxLabelsPerIssue: 5,
              verboseLogging: true,
              maxRetries: 3,
              retryDelay: 1000
            };
            
            const rules = loadRules();
            await autoLabelIssues(github, context, config, rules);
