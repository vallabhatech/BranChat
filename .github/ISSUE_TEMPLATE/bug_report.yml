name: Bug Report
description: Report a problem or regression in BranChat.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: input
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Add images/links to screenshots if applicable.
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser/OS, frontend/backend, versions, etc.
      placeholder: "e.g., Windows 11, Chrome 126, Node 20.x"
    validations:
      required: true

